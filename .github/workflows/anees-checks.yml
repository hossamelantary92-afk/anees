name: Anees stability checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [stability-ios-safe-recovery-20261103]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: TypeScript check
        run: npm run lint
        continue-on-error: true
      - name: Worship tests
        run: npm test
        if: always()
        continue-on-error: true
      - name: Production build
        run: npm run build
        if: always()
